name: Build and deploy Node.js worker to Azure Web App - worker

on:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "packages/shared/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/main_worker.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build API and worker
        run: npm run build --workspace=apps/api

      - name: Verify worker build
        run: test -f apps/api/dist/worker.js

      - name: Prepare worker artifact
        run: |
          rm -rf deploy
          mkdir -p deploy/apps/api deploy/apps/web deploy/packages
          cp -R apps/api/dist deploy/apps/api/dist
          cp apps/api/package.json deploy/apps/api/package.json
          cp apps/web/package.json deploy/apps/web/package.json
          cp package.json package-lock.json deploy/
          cp -R packages/shared deploy/packages/shared
          npm ci --omit=dev --prefix deploy

      - name: Upload worker artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-worker
          path: deploy
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download worker artifact
        uses: actions/download-artifact@v4
        with:
          name: node-worker

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8C03E2BD3C944F3BBD454CC5CB5498E3 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_8929C31460764A2FAA7C2C6D5A5AD91A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_95A73BA2B7D747EE8ADD79B34C202E9A }}

      - name: Configure worker startup and dependency build
        run: |
          az webapp config appsettings set \
            --resource-group trace-app-prod \
            --name worker \
            --settings SCM_DO_BUILD_DURING_DEPLOYMENT=false
          az webapp config set \
            --resource-group trace-app-prod \
            --name worker \
            --startup-file "node /home/site/wwwroot/apps/api/dist/worker.js"

      - name: Deploy worker to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: worker
          slot-name: Production
          package: .
