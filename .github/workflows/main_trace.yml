name: Build and deploy Node.js app to Azure Web App - trace

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build API
        run: npm run build --workspace=apps/api

      - name: Verify build
        run: |
          test -f apps/api/dist/server.js
          echo "Build successful"
          ls -la apps/api/dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-api
          path: .
          exclude: |
            .git/**
            node_modules/**

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-api

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.YOUR_EXISTING_NODE_CLIENT_SECRET }}
          tenant-id: ${{ secrets.YOUR_EXISTING_NODE_TENANT_SECRET }}
          subscription-id: ${{ secrets.YOUR_EXISTING_NODE_SUBSCRIPTION_SECRET }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: trace
          slot-name: Production
          package: .
