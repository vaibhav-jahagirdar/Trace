name: Build and deploy Node.js app to Azure Web App - trace

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build API
        run: npm run build --workspace=apps/api

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-api
          path: |
            apps/api/dist
            apps/api/package.json
            package.json
            package-lock.json
            packages/shared

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-api

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: 4341d6c3-4c9b-4b21-915e-e1af2742d114
          tenant-id: 6357eaf1-89a4-49d2-8a56-82fdd92f61de
          subscription-id: 6634d5da-b1c6-413e-a684-721f8cca6ee7






      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: "trace"
          slot-name: "Production"
          package: .
