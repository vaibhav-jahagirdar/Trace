name: Build and deploy Python app to Azure Web App - trace-analysis

on:
  push:
    branches:
      - main
    paths:
      - "apps/analysis/**"
      - ".github/workflows/*analysis*.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: apps/analysis
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Upload Python app
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: apps/analysis

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_CD22F5170F3C46FE8347569FF57A2232 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_483BC1B5BFFA4E2D8376D13718E20E5A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_222C7BFF15994B06ABA24C3286D6BF28 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: trace-analysis
          slot-name: Production
          package: .
